<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trivia</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, sans-serif;
            background-color: #0f0f0f;
            color: #f0f0f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 30px 16px;
        }

        .container {
            width: 100%;
            max-width: 640px;
        }

        h1 {
            font-size: 1.8em;
            font-weight: bold;
            margin-bottom: 24px;
            letter-spacing: 0.05em;
            color: #fff;
        }

        /* Controls */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 28px;
        }

        select {
            width: 100%;
            padding: 10px 14px;
            background: #1e1e1e;
            color: #f0f0f0;
            border: 1px solid #333;
            border-radius: 6px;
            font-size: 1em;
            appearance: none;
            cursor: pointer;
        }

        select:focus { outline: none; border-color: #4fc3f7; }

        .difficulty-row {
            display: flex;
            gap: 8px;
        }

        .diff-btn {
            flex: 1;
            padding: 9px 0;
            background: #1e1e1e;
            color: #aaa;
            border: 1px solid #333;
            border-radius: 6px;
            font-size: 0.9em;
            cursor: pointer;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
        }

        .diff-btn:hover { background: #2a2a2a; color: #f0f0f0; }

        .diff-btn.active {
            background: #1a3a4a;
            color: #4fc3f7;
            border-color: #4fc3f7;
        }

        /* Question card */
        .card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 16px;
        }

        .meta {
            font-size: 0.78em;
            color: #666;
            margin-bottom: 14px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .question {
            font-size: 1.15em;
            line-height: 1.55;
            margin-bottom: 22px;
            color: #f0f0f0;
        }

        .answers {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .answer {
            padding: 12px 16px;
            background: #222;
            border: 1px solid #333;
            border-radius: 6px;
            font-size: 1em;
            cursor: default;
            transition: background 0.2s, border-color 0.2s, color 0.2s;
            line-height: 1.4;
        }

        .answer.correct {
            background: #1a3a1a;
            border-color: #66bb6a;
            color: #66bb6a;
            font-weight: bold;
        }

        /* Action buttons */
        .actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            background: #1e1e1e;
            color: #f0f0f0;
            border: 1px solid #333;
            border-radius: 6px;
            font-size: 1em;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }

        .btn:hover { background: #2a2a2a; border-color: #555; }

        .btn-primary {
            background: #1a3a4a;
            border-color: #4fc3f7;
            color: #4fc3f7;
        }

        .btn-primary:hover { background: #1f4a5e; }

        .status {
            text-align: center;
            color: #555;
            font-size: 0.9em;
            padding: 40px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Trivia</h1>

        <div class="controls">
            <select id="categorySelect">
                <option value="">Any Category</option>
            </select>
            <div class="difficulty-row">
                <button class="diff-btn active" data-value="">Any</button>
                <button class="diff-btn" data-value="easy">Easy</button>
                <button class="diff-btn" data-value="medium">Medium</button>
                <button class="diff-btn" data-value="hard">Hard</button>
            </div>
        </div>

        <div class="card">
            <div class="meta" id="questionMeta"></div>
            <div class="question" id="questionText"><span class="status">Loading...</span></div>
            <div class="answers" id="answers"></div>
        </div>

        <div class="actions">
            <button class="btn" id="revealAnswerBtn">Reveal Answer</button>
            <button class="btn btn-primary" id="newQuestionBtn">Next Question</button>
        </div>
    </div>

    <script src="/static/js/fetch_question.js"></script>
</body>
</html>
